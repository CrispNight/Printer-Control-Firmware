name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  protocol:
    name: Protocol bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Fails if protocol.py was not regenerated after a protocol.h change,
      # which is how the firmware and PC sides are kept from drifting apart.
      - name: protocol.py is up to date with protocol.h
        run: python tools/gen_protocol.py --check

      - name: Round-trip checks
        run: python tools/test_protocol.py

  firmware:
    name: Build ${{ matrix.env }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [teensy-galvo, arduino-mega, esp32-fan-esc]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-${{ matrix.env }}-${{ hashFiles('platformio.ini') }}
          restore-keys: pio-${{ matrix.env }}-

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build
        run: pio run -e ${{ matrix.env }}
