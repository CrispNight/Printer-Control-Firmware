; Moiren SLM — machine-side firmware
; One PlatformIO project, three boards, three environments.
;
; Build/upload a single board:
;   pio run -e teensy-galvo
;   pio run -e arduino-mega   -t upload
;   pio run -e esp32-fan-esc  -t upload
;
; Build all three (what CI does):
;   pio run
;
; Sources are isolated per board with build_src_filter, so an env only ever
; compiles its own folder. Code shared by more than one board goes in
; lib/moiren_link/ (or a new lib/<name>/) and is picked up automatically.

[platformio]
default_envs = teensy-galvo, arduino-mega, esp32-fan-esc
src_dir       = src
lib_dir       = lib

; ---------------------------------------------------------------------------
; Settings common to every board.
; protocol/ is on the include path everywhere so all three boards — and the
; PC-side repo — speak the identical wire format from protocol/protocol.h.
; ---------------------------------------------------------------------------
[env]
framework       = arduino
build_flags     =
    -I protocol
    -Wall
    -Wextra
build_src_filter = -<*>
monitor_speed   = 115200

; ---------------------------------------------------------------------------
; Teensy 4.1 — galvo + laser control. Intended master of the machine.
; ---------------------------------------------------------------------------
[env:teensy-galvo]
platform         = teensy
board            = teensy41
build_src_filter = -<*> +<teensy-galvo/>
build_flags      =
    ${env.build_flags}
    -DMOIREN_NODE=NODE_TEENSY_GALVO
upload_protocol  = teensy-cli
lib_deps         =

; ---------------------------------------------------------------------------
; Arduino Mega 2560 — steppers, O2/temperature sensing, safety interlocks.
; Also owns airflow today (see NODE_AIRFLOW in protocol/protocol.h).
; ---------------------------------------------------------------------------
[env:arduino-mega]
platform         = atmelavr
board            = megaatmega2560
build_src_filter = -<*> +<arduino-mega/>
build_flags      =
    ${env.build_flags}
    -DMOIREN_NODE=NODE_ARDUINO_MEGA
; Uncomment when motion.cpp lands. The skeleton does not use AccelStepper, and
; declaring it makes an offline build fail on a dependency nothing needs yet.
; A local copy also sits at ../Arduino/libraries/AccelStepper.
; lib_deps = waspinator/AccelStepper@^1.64

; ---------------------------------------------------------------------------
; ESP32 — EDF fan speed control via ESC. Not yet built or wired.
; board = esp32dev (generic WROOM-32 DevKit); change once the module is chosen.
; ---------------------------------------------------------------------------
[env:esp32-fan-esc]
platform         = espressif32
board            = esp32dev
build_src_filter = -<*> +<esp32-fan-esc/>
build_flags      =
    ${env.build_flags}
    -DMOIREN_NODE=NODE_ESP32_FAN
lib_deps         =
